<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title class="i18n" data-i18n-name="SettingsTitle"></title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="icon" href="../icon/icon128.png" />
        <link type="text/css" rel="stylesheet" href="./options.css" />
    </head>

    <body>
        <div id="option">
            <header>
            <img src="../icon/icon128.png" />
            <span class="space"></span>
            <span class="space"></span>
            轻量翻译
        </header>
            <div class="content">
                <label class="setting-title">翻译服务</label>
                <div class="row">
                    <div class="column">
                        <label
                            class="checked-label"
                            style="justify-content: flex-start; gap: 8px;"
                        >
                            服务模式：
                            <select
                                id="translation-service"
                                setting-type="select"
                                setting-path="TranslationService"
                                class="translator-config"
                            >
                                <option value="free">硅基流动（免费）</option>
                                <option value="custom">硅基流动（自定义）</option>
                                <option value="provider">自定义服务商</option>
                            </select>
                        </label>
                    </div>
                    <div class="column" id="model-column">
                        <label
                            for="ai-model"
                            class="checked-label"
                            style="justify-content: flex-start; gap: 8px;"
                        >
                            翻译模型：
                            <select
                                id="ai-model"
                                setting-type="select"
                                setting-path="AIModel"
                                class="translator-config"
                            ></select>
                            <input
                                id="ai-model-input"
                                type="text"
                                setting-type="text"
                                setting-path="CustomModelName"
                                class="translator-config"
                                placeholder="输入模型名称，如 Qwen/Qwen3-8B"
                                style="display: none; flex: 1 1 auto; min-width: 0;"
                            />
                            <span id="custom-model-col" style="display: none; margin-left: 8px;">
                                <input
                                    type="checkbox"
                                    id="custom-model"
                                    value="custom-model"
                                    setting-type="switch"
                                    setting-path="CustomModel"
                                />
                                <span class="space"></span>
                                自定义
                            </span>
                        </label>
                    </div>
                </div>
                <div class="row" id="apikey-row" style="display: none;">
                    <div class="column" style="flex: 1 1 auto; min-width: 0;">
                        <label
                            for="api-key"
                            class="checked-label"
                            style="justify-content: flex-start; gap: 8px; width: 100%;"
                        >
                            <span style="white-space: nowrap;">API Key：</span>
                            <input
                                id="api-key"
                                type="password"
                                setting-type="password"
                                setting-path="ApiKey"
                                class="translator-config"
                                placeholder="硅基流动（自定义）模式下填写你的 SiliconFlow API Key"
                                style="flex: 1 1 auto; min-width: 0; width: 100%;"
                            />
                        </label>
                    </div>
                </div>

                <!-- 自定义第三方服务商（仅「自定义服务商」模式显示）
                     说明：本节输入框刻意不带 setting-path —— 服务商是对象数组，
                     单个 setting-path 表达不了，因此由 options.js 整份读写 CustomProviders。
                     本节所有 input 也都不参与声明式绑定（bootstrap 已跳过无 setting-path 的元素）。 -->
                <div id="provider-section" style="display: none;">
                    <div class="setting-subtitle i18n" data-i18n-name="ProviderCurrent"></div>

                    <!-- 服务商切换：每行一个可点击的行（而不是原生 select）。
                         用行而不是下拉，是为了让「当前生效的那个」能有自己的按钮样式，
                         与「新增 / 保存 / 测试」这些操作按钮明显区分开。 -->
                    <div id="provider-list" class="provider-list"></div>
                    <p
                        id="provider-empty-hint"
                        class="setting-hint i18n"
                        data-i18n-name="ProviderEmptyHint"
                        style="display: none;"
                    ></p>
                    <p
                        id="provider-list-hint"
                        class="setting-hint i18n"
                        data-i18n-name="ProviderSectionHint"
                    ></p>
                    <div class="provider-toolbar">
                        <button
                            type="button"
                            id="provider-add"
                            class="option-button i18n"
                            data-i18n-name="ProviderAdd"
                        ></button>
                    </div>

                    <div id="provider-editor">
                        <div class="provider-field">
                            <label class="i18n" data-i18n-name="ProviderName" for="provider-name"></label>
                            <input id="provider-name" type="text" class="translator-config" />
                        </div>
                        <div class="provider-field">
                            <label class="i18n" data-i18n-name="ProviderEndpoint" for="provider-endpoint"></label>
                            <input
                                id="provider-endpoint"
                                type="text"
                                class="translator-config"
                                placeholder="https://api.example.com/v1"
                            />
                        </div>
                        <div class="provider-field">
                            <label class="i18n" data-i18n-name="ProviderApiKey" for="provider-api-key"></label>
                            <input id="provider-api-key" type="password" class="translator-config" />
                        </div>
                        <div class="provider-field provider-field-wide">
                            <label class="i18n" data-i18n-name="ProviderModel" for="provider-model-input"></label>
                            <div class="provider-models">
                                <!-- 模型列表：与上面的服务商列表同一套交互（点击切换、逐项删除），
                                     保持一致的心智模型。改动同样只进草稿，点「保存」才提交。 -->
                                <div id="provider-model-list" class="provider-list provider-list-compact"></div>
                                <p
                                    id="provider-model-empty"
                                    class="setting-hint i18n"
                                    data-i18n-name="ProviderModelEmptyHint"
                                ></p>
                                <div class="provider-model-add">
                                    <input
                                        id="provider-model-input"
                                        type="text"
                                        class="translator-config"
                                        list="provider-model-datalist"
                                        placeholder="gpt-4o-mini"
                                    />
                                    <datalist id="provider-model-datalist"></datalist>
                                    <button
                                        type="button"
                                        id="provider-model-add"
                                        class="option-button i18n"
                                        data-i18n-name="ProviderModelAdd"
                                    ></button>
                                    <button
                                        type="button"
                                        id="provider-models"
                                        class="option-button i18n"
                                        data-i18n-name="ProviderFetchModels"
                                    ></button>
                                </div>
                            </div>
                        </div>
                        <div class="provider-field provider-field-wide">
                            <label class="i18n" data-i18n-name="ProviderHeaders" for="provider-headers"></label>
                            <textarea
                                id="provider-headers"
                                class="translator-config"
                                rows="2"
                                placeholder="X-Api-Key: your-key"
                            ></textarea>
                        </div>

                        <div class="provider-actions">
                            <button
                                type="button"
                                id="provider-save"
                                class="option-button primary i18n"
                                data-i18n-name="ProviderSave"
                            ></button>
                            <button
                                type="button"
                                id="provider-cancel"
                                class="option-button i18n disabled-when-clean"
                                data-i18n-name="ProviderCancel"
                            ></button>
                            <span id="provider-dirty" class="provider-dirty i18n" data-i18n-name="ProviderUnsaved" style="display: none;"></span>
                        </div>
                        <div class="provider-actions provider-actions-secondary">
                            <button
                                type="button"
                                id="provider-test"
                                class="option-button i18n"
                                data-i18n-name="ProviderTest"
                            ></button>
                            <span id="provider-status" class="provider-status"></span>
                        </div>
                        <p class="setting-hint i18n" data-i18n-name="ProviderHint"></p>
                    </div>
                </div>

                <label
                    for="layout-settings"
                    class="setting-title i18n"
                    data-i18n-name="LayoutSettings"
                ></label>
                <div id="layout-settings">
                    <div class="row">
                        <div class="column">
                            <label
                                class="checked-label"
                                style="justify-content: flex-start; gap: 8px;"
                            >
                                页面翻译：
                                <select
                                    setting-type="select"
                                    setting-path="PageTranslationDisplayMode"
                                >
                                    <option value="original">仅原文</option>
                                    <option value="translated">仅译文</option>
                                    <option value="bilingual">对照（原文 + 译文）</option>
                                </select>
                            </label>
                        </div>
                        <div class="column">
                            <label
                                for="select-translate-position"
                                class="checked-label i18n"
                                data-i18n-name="SelectTranslatePosition"
                                data-insert-pos="afterBegin"
                            >
                                <select
                                    setting-type="select"
                                    id="select-translate-position"
                                    value="SelectTranslatePosition"
                                    setting-path="LayoutSettings SelectTranslatePosition"
                                >
                                    <option
                                        value="TopRight"
                                        data-i18n-name="TopRight"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="TopLeft"
                                        data-i18n-name="TopLeft"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="BottomRight"
                                        data-i18n-name="BottomRight"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="BottomLeft"
                                        data-i18n-name="BottomLeft"
                                        class="i18n"
                                    ></option>
                                </select>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                value="resize"
                                setting-type="switch"
                                setting-path="LayoutSettings Resize"
                                class="switch"
                                id="Resize"
                            />
                            <span class="space"></span>
                            <label
                                for="Resize"
                                class="checked-label i18n"
                                data-i18n-name="ResizeSetting"
                            ></label>
                        </div>
                        <div class="column">
                            <input
                                type="checkbox"
                                value="FoldLongContent"
                                setting-type="switch"
                                setting-path="LayoutSettings FoldLongContent"
                                class="switch"
                                id="FoldLongContent"
                            />
                            <span class="space"></span>
                            <label
                                for="FoldLongContent"
                                class="checked-label i18n"
                                data-i18n-name="FoldLongContentSetting"
                            ></label>
                        </div>
                    </div>

                    <!-- 划词翻译结果框样式 -->
                    <label
                        class="setting-subtitle i18n"
                        data-i18n-name="DisplayStyleSetting"
                    ></label>
                    <div class="row">
                        <div class="column">
                            <label
                                class="checked-label i18n"
                                data-i18n-name="PanelAppearance"
                                data-insert-pos="afterBegin"
                            >
                                <select
                                    setting-type="select"
                                    id="panel-style"
                                    setting-path="DisplayStyle PanelStyle"
                                >
                                    <option
                                        value="glass"
                                        data-i18n-name="PanelStyleGlass"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="solid"
                                        data-i18n-name="PanelStyleSolid"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="dark"
                                        data-i18n-name="PanelStyleDark"
                                        class="i18n"
                                    ></option>
                                </select>
                            </label>
                        </div>
                        <div class="column">
                            <label
                                class="checked-label i18n"
                                data-i18n-name="TextColorSetting"
                                data-insert-pos="afterBegin"
                            >
                                <select
                                    setting-type="select"
                                    id="display-text-color"
                                    setting-path="DisplayStyle TextColor"
                                >
                                    <option
                                        value="auto"
                                        data-i18n-name="TextColorAuto"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="dark"
                                        data-i18n-name="TextColorDark"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="light"
                                        data-i18n-name="TextColorLight"
                                        class="i18n"
                                    ></option>
                                </select>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <label
                                class="checked-label i18n"
                                data-i18n-name="FontSizeSetting"
                                data-insert-pos="afterBegin"
                            >
                                <select
                                    setting-type="select"
                                    id="display-font-size"
                                    setting-path="DisplayStyle FontSize"
                                >
                                    <option
                                        value="small"
                                        data-i18n-name="FontSizeSmall"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="medium"
                                        data-i18n-name="FontSizeMedium"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="large"
                                        data-i18n-name="FontSizeLarge"
                                        class="i18n"
                                    ></option>
                                </select>
                            </label>
                        </div>
                        <div class="column">
                            <label
                                class="checked-label i18n"
                                data-i18n-name="CornerRadiusSetting"
                                data-insert-pos="afterBegin"
                            >
                                <select
                                    setting-type="select"
                                    id="display-corner-radius"
                                    setting-path="DisplayStyle CornerRadius"
                                >
                                    <option
                                        value="none"
                                        data-i18n-name="CornerRadiusNone"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="small"
                                        data-i18n-name="CornerRadiusSmall"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="medium"
                                        data-i18n-name="CornerRadiusMedium"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="large"
                                        data-i18n-name="CornerRadiusLarge"
                                        class="i18n"
                                    ></option>
                                </select>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                value="shadow"
                                setting-type="switch"
                                setting-path="DisplayStyle Shadow"
                                class="switch"
                                id="panel-shadow"
                            />
                            <span class="space"></span>
                            <label
                                for="panel-shadow"
                                class="checked-label i18n"
                                data-i18n-name="PanelShadowSetting"
                            ></label>
                        </div>
                    </div>

                    <!-- 整页翻译对照模式下的译文样式（与上面划词结果框相互独立） -->
                    <label
                        class="setting-subtitle i18n"
                        data-i18n-name="PageTranslationStyleSetting"
                    ></label>
                    <div class="row">
                        <div class="column">
                            <label
                                class="checked-label i18n"
                                data-i18n-name="PageThemeSetting"
                                data-insert-pos="afterBegin"
                            >
                                <select
                                    setting-type="select"
                                    id="page-translation-theme"
                                    setting-path="PageTranslationStyle Theme"
                                >
                                    <option
                                        value="block"
                                        data-i18n-name="PageThemeBlock"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="highlight"
                                        data-i18n-name="PageThemeHighlight"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="underline"
                                        data-i18n-name="PageThemeUnderline"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="plain"
                                        data-i18n-name="PageThemePlain"
                                        class="i18n"
                                    ></option>
                                </select>
                            </label>
                        </div>
                        <div class="column">
                            <label
                                class="checked-label i18n"
                                data-i18n-name="AccentColorSetting"
                                data-insert-pos="afterBegin"
                            >
                                <select
                                    setting-type="select"
                                    id="page-translation-accent"
                                    setting-path="PageTranslationStyle Accent"
                                >
                                    <option
                                        value="blue"
                                        data-i18n-name="AccentBlue"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="green"
                                        data-i18n-name="AccentGreen"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="orange"
                                        data-i18n-name="AccentOrange"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="gray"
                                        data-i18n-name="AccentGray"
                                        class="i18n"
                                    ></option>
                                </select>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <label
                                class="checked-label i18n"
                                data-i18n-name="FontSizeSetting"
                                data-insert-pos="afterBegin"
                            >
                                <select
                                    setting-type="select"
                                    id="page-translation-font-size"
                                    setting-path="PageTranslationStyle FontSize"
                                >
                                    <option
                                        value="small"
                                        data-i18n-name="FontSizeSmall"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="medium"
                                        data-i18n-name="FontSizeMedium"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="large"
                                        data-i18n-name="FontSizeLarge"
                                        class="i18n"
                                    ></option>
                                </select>
                            </label>
                        </div>
                        <div class="column">
                            <label
                                class="checked-label i18n"
                                data-i18n-name="CornerRadiusSetting"
                                data-insert-pos="afterBegin"
                            >
                                <select
                                    setting-type="select"
                                    id="page-translation-radius"
                                    setting-path="PageTranslationStyle Radius"
                                >
                                    <option
                                        value="none"
                                        data-i18n-name="CornerRadiusNone"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="small"
                                        data-i18n-name="CornerRadiusSmall"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="medium"
                                        data-i18n-name="CornerRadiusMedium"
                                        class="i18n"
                                    ></option>
                                    <option
                                        value="large"
                                        data-i18n-name="CornerRadiusLarge"
                                        class="i18n"
                                    ></option>
                                </select>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                value="page-dark-mode"
                                setting-type="switch"
                                setting-path="PageTranslationStyle DarkMode"
                                class="switch"
                                id="page-translation-dark-mode"
                            />
                            <span class="space"></span>
                            <label
                                for="page-translation-dark-mode"
                                class="checked-label i18n"
                                data-i18n-name="PageDarkModeSetting"
                            ></label>
                        </div>
                    </div>

                    <!-- 整页翻译范围：哪些内容参与翻译（只做排除，改动后需重新翻译本页） -->
                    <label
                        class="setting-subtitle i18n"
                        data-i18n-name="PageTranslationScopeSetting"
                    ></label>
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                value="page-skip-invisible"
                                setting-type="switch"
                                setting-path="PageTranslationScope SkipInvisible"
                                class="switch"
                                id="page-skip-invisible"
                            />
                            <span class="space"></span>
                            <label
                                for="page-skip-invisible"
                                class="checked-label i18n"
                                data-i18n-name="SkipInvisibleSetting"
                            ></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                value="page-skip-sticky"
                                setting-type="switch"
                                setting-path="PageTranslationScope SkipSticky"
                                class="switch"
                                id="page-skip-sticky"
                            />
                            <span class="space"></span>
                            <label
                                for="page-skip-sticky"
                                class="checked-label i18n"
                                data-i18n-name="SkipStickySetting"
                            ></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                value="page-skip-chrome"
                                setting-type="switch"
                                setting-path="PageTranslationScope SkipSemanticChrome"
                                class="switch"
                                id="page-skip-chrome"
                            />
                            <span class="space"></span>
                            <label
                                for="page-skip-chrome"
                                class="checked-label i18n"
                                data-i18n-name="SkipSemanticChromeSetting"
                            ></label>
                        </div>
                    </div>
                    <p
                        class="setting-hint i18n"
                        data-i18n-name="PageTranslationScopeHint"
                    ></p>
                </div>

                <label
                    for="other-settings"
                    class="setting-title i18n"
                    data-i18n-name="OtherSettings"
                ></label>
                <div id="other-settings">
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings MutualTranslate"
                                class="switch"
                                id="mutual-translate"
                            />
                            <span class="space"></span>
                            <label
                                for="mutual-translate"
                                class="checked-label i18n"
                                data-i18n-name="MutualTranslation"
                            ></label>
                        </div>
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings SelectTranslate"
                                class="switch"
                                id="select-translate"
                            />
                            <span class="space"></span>
                            <label
                                for="select-translate"
                                class="checked-label i18n"
                                data-i18n-name="SelectTranslate"
                            ></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings UsePDFjs"
                                class="switch"
                                id="use-pdf-js"
                            />
                            <span class="space"></span>
                            <label
                                for="use-pdf-js"
                                class="checked-label i18n"
                                data-i18n-name="UsePDFjs"
                            ></label>
                        </div>
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings TranslateAfterSelect"
                                class="switch"
                                id="translate-after-select"
                            />
                            <span class="space"></span>
                            <label
                                for="translate-after-select"
                                class="checked-label i18n"
                                data-i18n-name="TranslateAfterSelect"
                            ></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings TranslateAfterDblClick"
                                class="switch"
                                id="translate-after-dbl-click"
                            />
                            <span class="space"></span>
                            <label
                                for="translate-after-dbl-click"
                                class="checked-label i18n"
                                data-i18n-name="TranslateAfterDblClick"
                            ></label>
                        </div>
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings CancelTextSelection"
                                class="switch"
                                id="cancel-text-selection"
                            />
                            <span class="space"></span>
                            <label
                                for="cancel-text-selection"
                                class="checked-label i18n"
                                data-i18n-name="CancelTextSelection"
